[project]
name = "cf-token"
version = "1"
description = "Display Cloudflare Access token for API usage"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.0",
    "fastapi>=0.136.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.1a7",
]

[project.scripts]
cf-token = "cf_token.cli:main"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "D100", "D103", "D104", "D203", "D213", "S104",
]

[tool.setuptools]
packages = ["cf_token"]

[tool.setuptools.package-data]
cf_token = ["templates/*.html", "static/*"]

[tool.uv]
package = true
